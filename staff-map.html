<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>مجسم توزيع الموظفين - الفرع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1a3a2a; --accent: #2d8653; --accent2: #f0a500;
    --bg: #f4f6f4; --card: #fff; --text: #1a2e1a; --muted: #6b8f71;
    --border: #d4e4d8; --red: #c0392b; --orange: #e08c00; --gray: #9aa8a0;
    --shadow: 0 2px 16px rgba(30,70,40,0.10); --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Cairo', Tahoma, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }

  .top-bar { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; padding: 14px 18px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 16px rgba(0,0,0,0.2); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
  .top-bar h1 { font-size: 17px; font-weight: 900; }
  .top-bar .sub { font-size: 11px; opacity: .85; margin-top: 2px; }
  .top-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .branch-select { background: rgba(255,255,255,.15); border: none; color: #fff; border-radius: 10px; padding: 8px 12px; font-family: 'Cairo',sans-serif; font-size: 13px; font-weight: 700; }
  .branch-select option { color: #000; }
  .clock { background: rgba(255,255,255,.15); border-radius: 10px; padding: 7px 14px; font-weight: 800; font-size: 15px; letter-spacing: .5px; }
  .top-btn { background: rgba(255,255,255,.15); border: none; color: #fff; border-radius: 10px; padding: 8px 14px; cursor: pointer; font-family: 'Cairo',sans-serif; font-size: 12px; font-weight: 700; }
  .top-btn:hover { background: rgba(255,255,255,.28); }
  .top-btn:disabled { opacity: .6; cursor: default; }

  .banner { font-size: 12px; padding: 8px 18px; text-align: center; font-weight: 700; }
  .banner.ok { background: #e8f5ee; border-bottom: 1.5px solid #b8dfc8; color: #1e6b40; }
  .banner.warn { background: #fff8e7; border-bottom: 1.5px solid #f0c040; color: #7a5a00; }

  .wrap { max-width: 1400px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 1fr 320px; gap: 16px; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }

  .summary { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 10px; margin-bottom: 4px; }
  .stat { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 14px; text-align: center; box-shadow: var(--shadow); }
  .stat .n { font-size: 26px; font-weight: 900; color: var(--primary); }
  .stat .l { font-size: 11px; color: var(--muted); font-weight: 700; margin-top: 2px; }
  .stat.warn .n { color: var(--red); }

  .floor { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px,1fr)); gap: 14px; align-content: start; }
  .dept-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); border: 2px solid var(--border); overflow: hidden; display: flex; flex-direction: column; }
  .dept-card.shortage { border-color: var(--red); }
  .dept-head { padding: 12px 14px; background: linear-gradient(135deg,#eef7f1,#fff); display: flex; align-items: center; justify-content: space-between; border-bottom: 1.5px solid var(--border); gap: 8px; }
  .dept-name { font-size: 14px; font-weight: 900; color: var(--primary); }
  .dept-count { font-size: 12px; font-weight: 800; white-space: nowrap; }
  .dept-count .present { color: var(--accent); }
  .dept-count .req { color: var(--muted); }
  .dept-count.short .present { color: var(--red); }
  .req-edit { width: 40px; border: 1.5px solid var(--border); border-radius: 6px; padding: 2px 4px; text-align: center; font-family: 'Cairo',sans-serif; font-size: 11px; margin-right: 4px; }
  .positions { padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: flex; align-items: center; gap: 7px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 20px; padding: 5px 10px 5px 5px; }
  .chip.anomaly { border-color: var(--red); background: #fef0ef; }
  .chip { cursor: pointer; position: relative; transition: transform .12s; }
  .chip:hover { transform: translateY(-1px); }
  .avatar-wrap { position: relative; flex-shrink: 0; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; color: #fff; }
  .avatar.present { background: var(--accent); box-shadow: 0 0 0 2px #b8e6c8; }
  .avatar.absent-onshift { background: var(--red); box-shadow: 0 0 0 2px #f5c6c0; }
  .avatar.off { background: var(--gray); }
  .avatar.faded { opacity: .4; filter: grayscale(60%); }
  .badge-pill { position: absolute; top: -8px; left: -10px; background: var(--red); color: #fff; font-size: 7.5px; font-weight: 900; padding: 1.5px 4px; border-radius: 6px; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .badge-pill.leave { background: var(--orange); }
  .chip-info { line-height: 1.25; }
  .chip-name { font-size: 11.5px; font-weight: 800; }
  .chip-role { font-size: 9.5px; color: var(--muted); font-weight: 700; }
  .chip-status { font-size: 9px; font-weight: 800; padding: 1px 6px; border-radius: 8px; margin-right: 2px; }
  .chip-status.present { background: #e8f5ee; color: var(--accent); }
  .chip-status.absent-onshift { background: #fef0ef; color: var(--red); }
  .chip-status.off { background: #eee; color: var(--gray); }

  .alerts-panel { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); border: 1.5px solid var(--border); padding: 14px; align-self: start; position: sticky; top: 90px; max-height: 80vh; overflow-y: auto; }
  .alerts-panel h3 { font-size: 14px; font-weight: 900; color: var(--primary); margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
  .alert-item { background: #fef0ef; border: 1.5px solid #f8cdc9; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 12px; }
  .alert-item .t { font-weight: 800; color: var(--red); margin-bottom: 3px; }
  .alert-item .d { color: #7a3530; font-size: 11px; }
  .no-alerts { text-align: center; color: var(--muted); padding: 24px 10px; font-size: 12px; }
  .no-alerts .icon { font-size: 34px; margin-bottom: 6px; }

  .sync-note { font-size: 10px; color: var(--muted); text-align: center; margin-top: 8px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 500; display: none; align-items: flex-end; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 20px 20px 0 0; width: 100%; max-width: 420px; padding: 0 0 24px; }
  .modal-head { display: flex; align-items: center; gap: 12px; padding: 20px 20px 14px; border-bottom: 1.5px solid var(--border); }
  .modal-avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg,var(--primary),var(--accent)); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900; flex-shrink: 0; }
  .modal-title { font-size: 16px; font-weight: 900; color: var(--primary); }
  .modal-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .modal-close { margin-right: auto; background: var(--bg); border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 16px; cursor: pointer; }
  .modal-body { padding: 16px 20px; }
  .status-now { text-align: center; border-radius: 12px; padding: 14px; font-weight: 900; font-size: 15px; margin-bottom: 16px; }
  .status-now.ok { background: #e8f5ee; color: var(--accent); }
  .status-now.bad { background: #fef0ef; color: var(--red); }
  .modal-info-row { display: flex; justify-content: space-between; font-size: 12px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .modal-info-row span:first-child { color: var(--muted); font-weight: 700; }
  .modal-info-row span:last-child { font-weight: 800; }
  .override-label { font-size: 12px; font-weight: 800; color: var(--primary); margin: 16px 0 8px; }
  .override-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .override-btn { border: 1.5px solid var(--border); background: var(--bg); border-radius: 10px; padding: 10px 4px; font-family: 'Cairo',sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; }
  .override-btn.active { border-color: var(--red); background: #fef0ef; color: var(--red); }
  .override-reset { width: 100%; margin-top: 8px; border: none; background: none; color: var(--muted); font-family: 'Cairo',sans-serif; font-size: 11px; padding: 8px; cursor: pointer; text-decoration: underline; }

  /* ===== محاكاة الفرع (شخصيات متحركة داخل الأقسام) ===== */
  .view-toggle { display: flex; gap: 4px; background: rgba(255,255,255,.15); border-radius: 10px; padding: 3px; }
  .view-toggle button { border: none; background: transparent; color: #fff; padding: 6px 12px; border-radius: 8px; font-family: 'Cairo',sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; opacity: .75; }
  .view-toggle button.active { background: #fff; color: var(--primary); opacity: 1; }
  .floor-sim { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap: 14px; }
  .sim-zone { position: relative; border-radius: var(--radius); border: 2px dashed var(--border); background:
      repeating-linear-gradient(90deg, #eef3ee 0 40px, #e6ede7 40px 80px);
      box-shadow: var(--shadow); overflow: hidden; }
  .sim-zone.shortage { border-color: var(--red); border-style: solid; }
  .sim-zone-label { position: absolute; top: 6px; right: 8px; background: rgba(255,255,255,.9); border-radius: 8px; padding: 4px 10px; font-size: 12px; font-weight: 900; color: var(--primary); z-index: 5; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .sim-zone-count { position: absolute; top: 6px; left: 8px; background: rgba(255,255,255,.9); border-radius: 8px; padding: 4px 8px; font-size: 11px; font-weight: 800; z-index: 5; }
  .sim-zone-count.short { color: var(--red); }
  .sim-person { position: absolute; width: 40px; text-align: center; cursor: pointer; transition: left 2.6s ease-in-out, top 2.6s ease-in-out; z-index: 2; }
  .sim-person .emoji { font-size: 24px; display: block; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); animation: sim-bob 0.6s ease-in-out infinite alternate; }
  .sim-person.faded .emoji { opacity: .35; filter: grayscale(80%); animation: none; }
  .sim-person .sim-label { font-size: 8px; font-weight: 800; background: rgba(255,255,255,.92); border-radius: 6px; padding: 1px 4px; white-space: nowrap; margin-top: -2px; display: inline-block; max-width: 70px; overflow: hidden; text-overflow: ellipsis; }
  .sim-person .badge-pill { top: -10px; left: 50%; transform: translateX(-50%); }
  @keyframes sim-bob { from { transform: translateY(0); } to { transform: translateY(-3px); } }
</style>
</head>
<body>

<div class="top-bar">
  <div>
    <h1>🏬 مجسم توزيع الموظفين</h1>
    <div class="sub">بيانات حقيقية من شيت "حضور و انصراف يومي" — مرتبطة بأكواد البصمة</div>
  </div>
  <div class="top-right">
    <div class="view-toggle">
      <button id="tabSim" onclick="setView('sim')">🎬 محاكاة الفرع</button>
      <button id="tabList" onclick="setView('list')">📋 قائمة</button>
    </div>
    <select class="branch-select" id="branchSelect"></select>
    <span class="clock" id="clockDisplay">--:--</span>
    <button class="top-btn" id="syncBtn" onclick="syncNow()">🔄 مزامنة الآن</button>
  </div>
</div>

<div class="banner" id="syncBanner">جارِ التحميل...</div>

<div class="wrap">

  <div class="summary">
    <div class="stat"><div class="n" id="statPresent">-</div><div class="l">حاضر الآن (في الشيفت)</div></div>
    <div class="stat"><div class="n" id="statRequired">-</div><div class="l">المطلوب الآن</div></div>
    <div class="stat"><div class="n" id="statRoster">-</div><div class="l">إجمالي الروستر بالفرع</div></div>
    <div class="stat warn"><div class="n" id="statAlerts">-</div><div class="l">تنبيهات حالية</div></div>
  </div>

  <div class="floor-sim" id="floorSim"></div>
  <div class="floor" id="floorGrid" style="display:none"></div>

  <div class="alerts-panel">
    <h3>🚨 التنبيهات <span id="alertCountBadge" style="font-size:11px;background:var(--red);color:#fff;border-radius:10px;padding:2px 8px;"></span></h3>
    <div id="alertsList"></div>
  </div>

</div>

<div class="modal-overlay" id="empModal" onclick="if(event.target===this) closeEmpModal()">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-avatar" id="modalAvatar">--</div>
      <div>
        <div class="modal-title" id="modalName">-</div>
        <div class="modal-sub" id="modalSub">-</div>
      </div>
      <button class="modal-close" onclick="closeEmpModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="status-now" id="modalStatusNow">-</div>
      <div class="modal-info-row"><span>القسم</span><span id="modalDept">-</span></div>
      <div class="modal-info-row"><span>الفرع</span><span id="modalBranch">-</span></div>
      <div class="modal-info-row"><span>الشيفت</span><span id="modalShift">-</span></div>
      <div class="modal-info-row"><span>كود البصمة</span><span id="modalCode">-</span></div>
      <div class="override-label">تحديد الحالة يدويًا (لو مش دقيقة تلقائيًا)</div>
      <div class="override-btns">
        <button class="override-btn" data-v="غياب" onclick="setOverride('غياب')">غياب</button>
        <button class="override-btn" data-v="تأخير" onclick="setOverride('تأخير')">تأخير</button>
        <button class="override-btn" data-v="اجازة" onclick="setOverride('اجازة')">اجازة</button>
      </div>
      <button class="override-reset" onclick="setOverride(null)">إعادة الحالة للوضع التلقائي</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   البيانات: لقطة (snapshot) حقيقية من شيت "حضور و انصراف يومي"
   على درايف الداتا سنتر — بالأكواد والأسماء والأقسام والشيفتات
   وحالة الحضور (atte) وقت آخر مزامنة.
   شكل البيانات: BRANCH_DATA[اسم الفرع][اسم القسم] = [موظف...]
   كل موظف: { name, role, shift, code, atte }

function getRequired(branch, dept, defaultCount) {
  try {
    const saved = JSON.parse(localStorage.getItem('staffmap_required') || '{}');
    return saved?.[branch]?.[dept] || buildDefaultCurve(defaultCount);
  } catch(e) { return buildDefaultCurve(defaultCount); }
}
function buildDefaultCurve(rosterSize) {
  // منحنى افتراضي: ذروة وقت الرشق (12-14 و18-21)، وأقل تواجد بالليل المتأخر
  const curve = {};
  for (let h = 0; h < 24; h++) {
    let factor = 0.55;
    if (h >= 8 && h <= 22) factor = 0.7;
    if ((h >= 12 && h <= 14) || (h >= 18 && h <= 21)) factor = 0.9;
    if (h >= 1 && h <= 5) factor = 0.35;
    curve[h] = Math.max(1, Math.round(rosterSize * factor));
  }
  return curve;
}
function saveRequired(branch, dept, hour, value) {
  const saved = JSON.parse(localStorage.getItem('staffmap_required') || '{}');
  saved[branch] = saved[branch] || {};
  saved[branch][dept] = saved[branch][dept] || buildDefaultCurve(0);
  saved[branch][dept][hour] = value;
  localStorage.setItem('staffmap_required', JSON.stringify(saved));
}

function onShiftNow(shift, minutesSinceMidnight) {
  const range = SHIFT_WINDOWS[shift] || SHIFT_WINDOWS['صباحي'];
  const hour = minutesSinceMidnight / 60;
  const [s,e] = range;
  if (e <= 24) return hour >= s && hour < e;
  return hour >= s || hour < (e - 24);
}

   حالة كل موظف عند الضغط عليه: منضبط / غياب / تأخير / اجازة.
   الوضع التلقائي مبني على atte + هل هو في شيفته دلوقتي.
   المدير يقدر يظبط الحالة يدويًا (تأخير/اجازة) لو المصدر
   التلقائي مش دقيق — بيتحفظ في localStorage بالكود.
========================================================= */
function getOverrides() {
  try { return JSON.parse(localStorage.getItem('staffmap_overrides') || '{}'); }
  catch(e) { return {}; }
}
function setOverrideFor(code, value) {
  const o = getOverrides();
  if (value) o[code] = value; else delete o[code];
  localStorage.setItem('staffmap_overrides', JSON.stringify(o));
}
function computeStatus(emp, minutesSinceMidnight) {
  const overrides = getOverrides();
  if (overrides[emp.code]) return overrides[emp.code]; // غياب / تأخير / اجازة يدوي
  const isOnShift = onShiftNow(emp.shift, minutesSinceMidnight);
  if (!isOnShift) return 'خارج الشيفت';
  return emp.atte === 'حضور' ? 'منضبط' : 'غياب';
}
function isBadStatus(status) { return status === 'غياب' || status === 'تأخير' || status === 'اجازة'; }

let currentEmpCode = null;
function openEmpModal(code, deptName, branch) {
  const emp = (BRANCH_DATA[branch]?.[deptName] || []).find(e => e.code === code);
  if (!emp) return;
  currentEmpCode = code;
  const now = new Date();
  const status = computeStatus(emp, now.getHours()*60 + now.getMinutes());
  document.getElementById('modalAvatar').textContent = initials(emp.name);
  document.getElementById('modalName').textContent = emp.name;
  document.getElementById('modalSub').textContent = emp.role;
  document.getElementById('modalDept').textContent = deptName;
  document.getElementById('modalBranch').textContent = branch;
  document.getElementById('modalShift').textContent = emp.shift;
  document.getElementById('modalCode').textContent = emp.code;
  const statusEl = document.getElementById('modalStatusNow');
  statusEl.textContent = status;
  statusEl.className = 'status-now ' + (status === 'منضبط' ? 'ok' : (status === 'خارج الشيفت' ? '' : 'bad'));
  document.querySelectorAll('.override-btn').forEach(b => b.classList.toggle('active', b.dataset.v === getOverrides()[code]));
  document.getElementById('empModal').classList.add('show');
  document.getElementById('empModal').dataset.dept = deptName;
  document.getElementById('empModal').dataset.branch = branch;
}
function closeEmpModal() { document.getElementById('empModal').classList.remove('show'); currentEmpCode = null; }
function setOverride(value) {
  if (!currentEmpCode) return;
  setOverrideFor(currentEmpCode, value);
  const modal = document.getElementById('empModal');
  const dept = modal.dataset.dept, branch = modal.dataset.branch;
  render();
  openEmpModal(currentEmpCode, dept, branch);
}

/* =========================================================
   مزامنة حية: بيحاول يجيب أحدث نسخة من شيت جوجل مباشرة من
   المتصفح (يحتاج مشاركة الشيت "Anyone with the link – Viewer").
   لو فشل (مفيش صلاحية مشاركة عامة)، بيفضل شغال باللقطة
   المُضمّنة في الملف وبيوضح إنها مش لايف تلقائي.
========================================================= */
async function syncNow() {
  const btn = document.getElementById('syncBtn');
  btn.disabled = true;
  btn.textContent = '🔄 جارِ المزامنة...';
  try {
    const res = await fetch(CSV_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('http ' + res.status);
    const text = await res.text();
    const parsed = parseCsvToBranchData(text);
    if (Object.keys(parsed).length === 0) throw new Error('empty parse');
    Object.assign(BRANCH_DATA, parsed);
    lastSyncTime = new Date();
    setBanner('ok', '✅ تمت المزامنة المباشرة مع شيت البصمة الساعة ' + lastSyncTime.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}));
  } catch (err) {
    setBanner('warn', '⚠️ تعذّر الاتصال المباشر بالشيت من المتصفح (محتاج تفعيل "مشاركة الرابط – Viewer" على الشيت). البيانات المعروضة دلوقتي هي آخر لقطة اتزامنت الساعة ' + lastSyncTime.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}) + ' — أو اطلب مني أعمل مزامنة يدوية.');
  }
  btn.disabled = false;
  btn.textContent = '🔄 مزامنة الآن';
  render();
}

function parseCsvToBranchData(csvText) {
  const rows = csvText.split(/\r?\n/).map(parseCsvLine).filter(r => r.length > 1);
  rows.shift(); // header
  const shiftMap = { Morning: 'صباحي', Night: 'ليلي', Between: 'بتوين', Training: 'صباحي' };
  const out = {};
  rows.forEach(r => {
    const [code, name, hire, workstatus, shift, branch, empstatus, dept, role, atte] = r;
    if (!name || name === '#N/A' || !branch || empstatus !== 'علي راس العمل') return;
    const d = dept || 'غير محدد';
    out[branch] = out[branch] || {};
    out[branch][d] = out[branch][d] || [];
    out[branch][d].push({ name: name.trim(), role: (role||'-').trim(), shift: shiftMap[shift] || shift || 'صباحي', code: (code||'').trim(), atte: (atte||'غياب').trim() });
  });
  return out;
}
function parseCsvLine(line) {
  const cells = []; let cur = ''; let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQ) {
      if (c === '"' && line[i+1] === '"') { cur += '"'; i++; }
      else if (c === '"') { inQ = false; }
      else cur += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { cells.push(cur); cur = ''; }
      else cur += c;
    }
  }
  cells.push(cur);
  return cells;
}
function setBanner(type, msg) {
  const el = document.getElementById('syncBanner');
  el.className = 'banner ' + type;
  el.textContent = msg;
}

/* =========================================================
   بناء قائمة الفروع + الرندر
========================================================= */
const branchSelect = document.getElementById('branchSelect');
Object.keys(BRANCH_DATA).forEach(b => {
  const opt = document.createElement('option');
  opt.value = b; opt.textContent = b;
  branchSelect.appendChild(opt);
});
branchSelect.value = currentBranch;
branchSelect.addEventListener('change', () => { currentBranch = branchSelect.value; render(); });

const initials = n => n.trim().split(' ').slice(0,2).map(w=>w[0]).join('');

let currentView = 'sim';
function setView(v) {
  currentView = v;
  document.getElementById('tabSim').classList.toggle('active', v === 'sim');
  document.getElementById('tabList').classList.toggle('active', v === 'list');
  document.getElementById('floorSim').style.display = v === 'sim' ? 'grid' : 'none';
  document.getElementById('floorGrid').style.display = v === 'list' ? 'grid' : 'none';
}
setView('sim');

/* شخصية/إيموجي تمثيلية حسب الوظيفة أو القسم — عشان يحس إنه شايف موظفين حقيقيين */
function emojiFor(role, dept) {
  const t = role + ' ' + dept;
  const has = s => t.indexOf(s) !== -1;
  if (has('شيف') || has('طاهي')) return '👨‍🍳';
  if (has('كاشير')) return '🧑‍💼';
  if (has('امن') || has('مراقب')) return '🛡️';
  if (has('دليفري')) return '🛵';
  if (has('ايس كريم') || has('باريستا')) return '🍦';
  if (has('فاكهه') || has('بقاله')) return '🧺';
  if (has('مخزن') || has('سائق')) return '📦';
  if (has('حسابات') || has('داتا') || has('تسعير')) return '💻';
  if (has('خدمة عملاء') || has('خدمه العملاء') || has('سيلز')) return '🎧';
  if (has('تجهيز') || has('معمل') || has('تصنيع') || has('تركي') || has('بيض') || has('رنجه')) return '👷';
  if (has('مدير') || has('ليدر') || has('هيد') || has('نائب')) return '🧑‍💼';
  return '🧑';
}

/* موقع عشوائي داخل حدود المنطقة (نسبة مئوية) */
function randPos() { return { left: 8 + Math.random()*74, top: 22 + Math.random()*65 }; }

function renderFloorSim(depts, minutesNow, hour) {
  const sim = document.getElementById('floorSim');
  sim.innerHTML = '';
  Object.keys(depts).forEach(deptName => {
    const employees = depts[deptName];
    const required = getRequired(currentBranch, deptName, employees.length);
    const reqNow = required[hour] ?? Math.max(1, Math.round(employees.length * 0.6));
    const statuses = employees.map(e => computeStatus(e, minutesNow));
    const presentNow = statuses.filter(s => s === 'منضبط').length;
    const short = presentNow < reqNow;

    const zoneHeight = Math.max(130, Math.min(260, 90 + employees.length * 22));
    const zone = document.createElement('div');
    zone.className = 'sim-zone' + (short ? ' shortage' : '');
    zone.style.minHeight = zoneHeight + 'px';
    zone.innerHTML = `
      <div class="sim-zone-label">${deptName}</div>
      <div class="sim-zone-count ${short?'short':''}">${presentNow}/${reqNow}</div>`;
    employees.forEach((e,i) => {
      const status = statuses[i];
      const bad = isBadStatus(status);
      const pos = bad ? { left: 10 + (i%5)*15, top: 18 } : randPos();
      const person = document.createElement('div');
      person.className = 'sim-person' + (bad ? ' faded' : '');
      person.style.left = pos.left + '%';
      person.style.top = pos.top + '%';
      person.onclick = () => openEmpModal(e.code, deptName, currentBranch);
      person.innerHTML = `
        ${bad ? `<span class="badge-pill ${status==='اجازة'?'leave':''}">${status}</span>` : ''}
        <span class="emoji">${emojiFor(e.role, deptName)}</span>
        <span class="sim-label">${e.name.split(' ')[0]}</span>`;
      zone.appendChild(person);
    });
    sim.appendChild(zone);
  });
}
function wanderTick() {
  if (currentView !== 'sim') return;
  document.querySelectorAll('.sim-person:not(.faded)').forEach(el => {
    const pos = randPos();
    el.style.left = pos.left + '%';
    el.style.top = pos.top + '%';
  });
}
setInterval(wanderTick, 2800);

function render() {
  const now = new Date();
  document.getElementById('clockDisplay').textContent = now.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
  const minutesNow = now.getHours()*60 + now.getMinutes();
  const hour = now.getHours();

  const depts = BRANCH_DATA[currentBranch] || {};
  const floor = document.getElementById('floorGrid');
  floor.innerHTML = '';

  let totalPresent = 0, totalRequired = 0, totalRoster = 0;
  const alerts = [];

  Object.keys(depts).forEach(deptName => {
    const employees = depts[deptName];
    totalRoster += employees.length;
    const required = getRequired(currentBranch, deptName, employees.length);
    const reqNow = required[hour] ?? Math.max(1, Math.round(employees.length * 0.6));

    const statuses = employees.map(e => computeStatus(e, minutesNow));
    const presentNow = statuses.filter(s => s === 'منضبط').length;
    const badOnes = employees.filter((e,i) => isBadStatus(statuses[i]));

    totalPresent += presentNow; totalRequired += reqNow;

    const short = presentNow < reqNow;
    if (short) {
      alerts.push({ title: `${deptName} (${currentBranch}): نقص موظفين`, detail: `الحاضر الآن ${presentNow} من أصل ${reqNow} مطلوبين في الساعة ${hour}:00` });
    }
    badOnes.forEach((e,idx) => {
      const s = statuses[employees.indexOf(e)];
      alerts.push({ title: `${deptName}: ${e.name} — ${s}`, detail: `الوظيفة: ${e.role} — شيفت ${e.shift} — كود ${e.code}` });
    });

    const card = document.createElement('div');
    card.className = 'dept-card' + (short ? ' shortage' : '');
    card.innerHTML = `
      <div class="dept-head">
        <div class="dept-name">${deptName}</div>
        <div class="dept-count ${short?'short':''}">
          <span class="present">${presentNow}</span> / <input type="number" class="req-edit" min="0" value="${reqNow}" data-dept="${deptName}">
        </div>
      </div>
      <div class="positions">
        ${employees.map((e,i) => {
          const status = statuses[i];
          const bad = isBadStatus(status);
          const cls = status === 'منضبط' ? 'present' : (bad ? 'absent-onshift' : 'off');
          const badgeClass = status === 'اجازة' ? 'leave' : '';
          return `<div class="chip ${bad?'anomaly':''}" onclick="openEmpModal('${e.code}','${deptName.replace(/'/g,"\\'")}','${currentBranch.replace(/'/g,"\\'")}')">
              <div class="avatar-wrap">
                <div class="avatar ${cls} ${bad?'faded':''}">${initials(e.name)}</div>
                ${bad ? `<span class="badge-pill ${badgeClass}">${status}</span>` : ''}
              </div>
              <div class="chip-info">
                <div class="chip-name">${e.name}</div>
                <div class="chip-role">${e.role} · ${e.shift} · #${e.code}</div>
              </div>
              <span class="chip-status ${cls}">${status}</span>
            </div>`;
        }).join('')}
      </div>`;
    floor.appendChild(card);
  });

  floor.querySelectorAll('.req-edit').forEach(inp => {
    inp.addEventListener('change', () => {
      saveRequired(currentBranch, inp.dataset.dept, hour, parseInt(inp.value,10) || 0);
      render();
    });
  });

  renderFloorSim(depts, minutesNow, hour);

  document.getElementById('statPresent').textContent = totalPresent;
  document.getElementById('statRequired').textContent = totalRequired;
  document.getElementById('statRoster').textContent = totalRoster;
  document.getElementById('statAlerts').textContent = alerts.length;

  const alertsList = document.getElementById('alertsList');
  const badge = document.getElementById('alertCountBadge');
  badge.textContent = alerts.length || '';
  badge.style.display = alerts.length ? 'inline-block' : 'none';
  alertsList.innerHTML = alerts.length === 0
    ? `<div class="no-alerts"><div class="icon">✅</div>كل الأقسام مغطاة حسب الخطة</div>`
    : alerts.map(a => `<div class="alert-item"><div class="t">${a.title}</div><div class="d">${a.detail}</div></div>`).join('');
}

setBanner('warn', 'البيانات المعروضة هي آخر لقطة اتزامنت — اضغط "🔄 مزامنة الآن" لتحديثها مباشرة من الشيت (يحتاج تفعيل مشاركة الرابط).');
setInterval(render, 15000);
render();
</script>
